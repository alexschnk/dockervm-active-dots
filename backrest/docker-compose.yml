services:
  backrest:
    image: ghcr.io/garethgeorge/backrest:latest
    container_name: backrest
    hostname: backrest    
    user: "1000:1000"
    volumes:
      - /home/alex/docker/backrest/data:/data
      - /home/alex/docker/backrest/config:/config
      - /home/alex/docker/backrest/cache:/cache
      - /home/alex/docker/backrest/tmp:/tmp
      - /home/alex/shares:/mnt:ro
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
      - TZ=Europe/Moscow
    restart: unless-stopped
    networks:
      proxy:
    labels:
      - "traefik.enable=true" 
      - "traefik.http.routers.backrest.entrypoints=https" 
      - "traefik.http.routers.backrest.rule=Host(`backrest.homelab.ru`)"  
      - "traefik.http.routers.backrest.tls=true" 
      - "traefik.http.routers.backrest.middlewares=security-headers@file,authelia@docker"
      - "traefik.http.services.backrest.loadbalancer.server.port=9898"
networks:
  proxy:
    name: proxy
    external: true
